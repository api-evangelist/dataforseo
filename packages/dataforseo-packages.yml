method: searched
source: >-
  https://docs.dataforseo.com/v3/ (Client libraries section), plus registry
  metadata endpoints: registry.npmjs.org, pypi.org/pypi/<pkg>/json,
  api.nuget.org, repo.packagist.org, api.github.com
notes: >-
  DataForSEO publishes officially supported client libraries for TypeScript,
  Python, C#, and Java, plus an official MCP server / CLI on npm and an official
  n8n community node. The Java client is NOT published to Maven Central — a
  search of search.maven.org for "dataforseo" returns 0 artifacts (probed
  2026-08-13) — so it is consumed from source/GitHub tags only. The PHP client
  the docs recommend first is authored by a community maintainer (jovixv /
  Vitaliy Lyabakh) and published under his own Packagist namespace, so it is
  recorded as official: false with the docs endorsement noted.

