deprecated_surface:
  server: https://github.com/dataforseo/mcp-server-typescript-deprecated
  note: >-
    The deprecated v2 MCP server exposed per-endpoint tools. DataForSEO's own
    published Claude skills (skills/dataforseo-amazon-competitor-auditor.md,
    skills/dataforseo-pricing-strategy.md) still call those v2 names —
    merchant_amazon_products_live_advanced, merchant_amazon_asin_live_advanced,
    merchant_amazon_sellers_live_advanced, merchant_amazon_locations. Of those,
    only merchant_amazon_locations has a matching operation in the harvested
    OpenAPI (AmazonLocations, GET /v3/merchant/amazon/locations); the three
    *_live_advanced tools correspond to Amazon Merchant Live endpoints that
    DataForSEO announced in mid-2026 and that are present in the current
    official spec but not in the snapshot under openapi/ (see
    lifecycle/dataforseo-lifecycle.yml spec_drift).

