method: derived
source: >-
  mcp/dataforseo-mcp.yml (tool list from the provider README, live tools/list is
  auth-gated) bound against the 554 operations in openapi/*.yml

summary: >-
  DataForSEO's v3 MCP server is deliberately NOT a one-tool-per-endpoint
  projection. It ships four tools: three documentation-navigation tools that
  have no REST equivalent, and one generic `api_request` passthrough that can
  reach any of the 554 REST operations by path. That means the crosswalk is
  unusual — coverage is nominally total but the binding is generic, so an agent
  gets no per-operation inputSchema from the MCP surface. The schema an agent
  needs still lives in the OpenAPI, which is why the crosswalk matters here.

surfaces:
  openapi:
    files: 12
    operations: 554
    path: openapi/
    gated: false
  mcp:
    url: https://mcp.dataforseo.com/mcp
    tools: 4
    gated: true
    note: >-
      POST tools/list returns 401 invalid auth. Tool names and descriptions come
      from the provider README; per-tool inputSchema requires authenticated
      introspection and is not recorded.
  graphql:
    present: false

crosswalk:

  - tool: api_request
    category: passthrough
    rest: ['*']
    binding: rest-generic
    confidence: high
    note: >-
      Takes an HTTP method plus a DataForSEO API path (`.ai` paths by default)
      and a `data` body, so it can invoke ANY of the 554 operations in
      openapi/*.yml. It carries no operation-specific parameter schema of its
      own: the real input contract for any given call is the requestBody schema
      of the matching OpenAPI operation. Treat openapi/ as the inputSchema
      source for this tool.

  - tool: docs_index
    category: documentation
    rest: []
    binding: none
    confidence: high
    note: >-
      Serves the DataForSEO documentation index (optionally filtered by API
      section). No REST operation exposes this; the nearest public analogue is
      the llms.txt index at https://dataforseo.com/llms.txt (mirrored in llms/).

  - tool: docs_list_sections
    category: documentation
    rest: []
    binding: none
    confidence: high

  - tool: docs_search
    category: documentation
    rest: []
    binding: none
    confidence: high
    note: >-
      Fetches a documentation page by URL or path and can return PHP, Node.js,
      Python and C# code examples. Documentation retrieval, not data retrieval.

mcp_only:
  - tool: docs_index
    reason: Documentation navigation; no public REST endpoint returns the docs index.
  - tool: docs_list_sections
    reason: Documentation navigation; no public REST endpoint.
  - tool: docs_search
    reason: >-
      Documentation retrieval with code-example generation; the .md docs pages it
      reads are public but are not part of the v3 REST contract.

