generated: '2026-08-13'
method: searched
source: https://docs.dataforseo.com/v3/appendix/errors/
format: proprietary-status-code
envelope:
  note: >-
    DataForSEO does NOT use RFC 9457 problem+json. Responses are
    application/json and, per the provider's own documentation, "DataForSEO API
    servers always return the 200 HTTP response code, except for" the four HTTP
    codes below. The real error signal is the numeric `status_code` /
    `status_message` pair, which appears twice: once at the top level of the
    response envelope (the request-level result) and once inside each object of
    the `tasks[]` array (the task-level result). An agent that branches on HTTP
    status alone will read almost every DataForSEO failure as a success.
  top_level_fields: [version, status_code, status_message, time, cost, tasks_count, tasks_error, tasks]
  task_level_fields: [id, status_code, status_message, time, cost, result_count, path, data, result]
  code_range: 10000-60000
  retrieval_endpoints:
    - operation: Errors
      path: GET /v3/appendix/errors
      spec: openapi/dataforseo-appendix-api-openapi.yml
      note: Returns the canonical list of possible errors and general status codes.
    - operation: Errors
      path: POST /v3/serp/errors
      spec: openapi/dataforseo-serp-api-openapi.yml
      note: >-
        Per-API "errors" endpoints (also BacklinksErrors, OnPageErrors,
        KeywordsDataErrors, DataforseoLabsErrors, MerchantErrors and siblings)
        return the tasks that errored in the past 7 days.

http_status_codes:
  - status: 401
    title: Unauthorized
    detail: >-
      You are not authorized to access this resource. See your login details
      here: https://app.dataforseo.com/api-access
    note: >-
      Observed live on an unauthenticated POST to /v3/appendix/user_data
      (2026-08-13): the body is still the standard envelope with
      status_code 40100, and the response carries
      WWW-Authenticate: Basic realm="DataForSEO REST API".
  - status: 402
    title: Payment Required
    detail: We had a problem billing your account. Please, check your account's balance.
  - status: 404
    title: Not Found
    detail: Requested endpoint not found
  - status: 500
    title: Internal Server Error
    detail: >-
      Sorry, we could not process your request due to the internal server error.
      Please, try again later.

classes:
  - prefix: '2xxxx'
    meaning: success
  - prefix: '4xxxx'
    meaning: client-side / account / request error
  - prefix: '406xx'
    meaning: task accepted but not yet ready (poll again)
  - prefix: '5xxxx'
    meaning: DataForSEO-side or third-party data-source failure

rate_limit_signal:
  code: 40202
  message: the rate-limit per minute has been exceeded.
  http_status: 200
  note: >-
    Rate-limit exhaustion is signalled by internal status_code 40202 inside a
    HTTP 200 response, not by HTTP 429. See rate-limits/dataforseo-rate-limits.yml.

concurrency_signal:
  code: 40209
  message: too many simultaneous queries.
  limit: 30
  scope: per user

