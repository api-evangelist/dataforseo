naming_convention:
  request: <Family><Endpoint>RequestInfo
  response: <Family><Endpoint>ResponseInfo
  task: <Family><Endpoint>TaskInfo
  result: <Family><Endpoint>ResultInfo
  item: <Feature>Element | <Feature>SerpItem | <Feature>ItemInfo
  note: >-
    Held consistently across all 12 specs, so schema names are predictable from
    the operationId. This is the single most useful property of the model for an
    agent: given operationId `GoogleOrganicLiveAdvanced` the response schema is
    `SerpGoogleOrganicLiveAdvancedResponseInfo`.

