      type: object
      properties:
        asins:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
          description: 'asins of target products

            required field

            product IDs of the products for which you need to find keyword intersections;

            specify the ASINs as in the following example:

            "asins": {

            "1": "019005476X",

            "2": "0190074442"

