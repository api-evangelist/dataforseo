    DataforseoLabsGoogleCompetitorsDomainLiveRequestInfo:
      type: object
      properties:
        target:
          type: string
          description: 'domain

            required field

            the domain name of the target website

            the domain should be specified without https:// and www.

            you can specify page URL, but the results will be specific to the domain in the specified URL'
        location_name:
          type:
          - string
          - 'null'
          description: 'full name of the location

            required field if you don’t specify location_code

            Note: it is required to specify either location_name or location_code

            you can receive the list of available locations with their location_name by making a separate request to the

            https://api.dataforseo.com/v3/dataforseo_labs/locations_and_languages

            example:

            United Kingdom'
        location_code:
          type:
          - integer
          - 'null'
          description: 'location code

            required field if you don’t specify location_name

            Note: it is required to specify either location_name or location_code

            you can receive the list of available locations with their location_code by making a separate request to the

            https://api.dataforseo.com/v3/dataforseo_labs/locations_and_languages

            example:

            2840'
        language_name:
          type:
          - string
          - 'null'
          description: 'full name of the language

            required field if you don’t specify language_code

            Note: it is required to specify either language_name or language_code

            you can receive the list of available languages with their language_name by making a separate request to the

            https://api.dataforseo.com/v3/dataforseo_labs/locations_and_languages

            example:

            English'
        language_code:
          type:
          - string
          - 'null'
          description: 'language code

            required field if you don’t specify language_name

            Note: it is required to specify either language_name or language_code

            you can receive the list of available languages with their language_code by making a separate request to the

            https://api.dataforseo.com/v3/dataforseo_labs/locations_and_languages

            example:

            en'
        item_types:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'display results by item type

            optional field

            indicates the type of search results included in the response

            Note: if the item_types array contains item types that are different from organic, the results will be ordered by the first item type in the array; you will not be able to sort and filter results by the types of search results not included in the response;

            possible values:

            ["organic", "paid", "featured_snippet", "local_pack"]

            default value:

            ["organic", "paid"]'
        include_clickstream_data:
          type:
          - boolean
          - 'null'
          description: 'include or exclude data from clickstream-based metrics in the result

            optional field

            if the parameter is set to true, you will receive clickstream_etv, clickstream_gender_distribution, and clickstream_age_distribution fields with clickstream data in the response

            default value: false

            with this parameter enabled, you will be charged double the price for the request

            learn more about how clickstream-based metrics are calculated in this help center article'
        filters:
          type:
          - array
          - 'null'
          items:
            type:
            - object
            - 'null'
          description: 'array of results filtering parameters

            optional field

            you can add several filters at once (8 filters maximum)

            you should set a logical operator and, or between the conditions

            the following operators are supported:

            regex, not_regex, <, <=, >, >=, =, <>, in, not_in

            example:

            ["metrics.organic.count",">",50]

            [[["metrics.organic.count",">=",50],"and",["metrics.organic.pos_1","in",[1,5]]],

            "or",

            ["metrics.organic.etv",">=","100"]]

            for more information about filters, please refer to Dataforseo Labs – Filters or this help center guide'
        order_by:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'results sorting rules

            optional field

            you can use the same values as in the filters array to sort the results

            possible sorting types:

            asc – results will be sorted in the ascending order

            desc – results will be sorted in the descending order

            you should use a comma to specify a sorting type

            example:

            ["metrics.paid.etv,asc"]

            Note: you can set no more than three sorting rules in a single request

            you should use a comma to separate several sorting rules

            example:

            ["metrics.organic.etv,desc","metrics.paid.count,asc"]

            default rule:

            ["metrics.organic.count,desc"]

            Note: if the item_types array contains item types that are different from organic, the results will be ordered by the first item type in the array'
        limit:
          type:
          - integer
          - 'null'
          description: 'the maximum number of returned domains

            optional field

            default value: 100

            maximum value: 1000'
        offset:
          type:
          - integer
          - 'null'
          description: 'offset in the results array of returned domains

            optional field

            default value: 0

            if you specify the 10 value, the first ten keywords in the results array will be omitted and the data will be provided for the successive keywords'
        max_rank_group:
          type:
          - integer
          - 'null'
          description: 'maximum rank up to which competitors will be considered

            optional field

            default value: 100

            if you specify 10 here, we will extract competitors from the top 10 Google search results only'
        exclude_top_domains:
          type:
          - boolean
          - 'null'
          description: 'indicates whether to exclude world’s largest websites

            optional field

            default value: false

            set to true if you want to get highly-relevant competitors excluding the websites listed below:

            wikipedia.org

            pinterest.com

            amazon.com

            google.com

            facebook.com

            wordpress.com

            medium.com

            quora.com

            reddit.com

            youtube.com

            ebay.com

            uol.com.br

            instagram.com

            olx.com

            twitter.com

            linkedin.com

            slideshare.net'
        exclude_domains:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'exclude domains from the results

            optional field

            use this parameter to exclude specific domains from the results

            Note: you can specify up to 1000 domains in this array

            example:

            "exclude_domains": [

            "reddit.com",

            "youtube.com"

            ]'
        intersecting_domains:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'additional domains for improving results accuracy

            optional field

            to improve the accuracy of the result, you can specify domains that are known to intersect with the target in SERPs;

            if you use this array, metrics in the result will be based on SERPs where both target website and intersecting_domains appear;

            Note: you can specify up to 20 domains in this array'
        ignore_synonyms:
          type:
          - boolean
          - 'null'
          description: 'ignore highly similar keywords

            optional field

            if set to true, only core keywords will be returned, all highly similar keywords will be excluded;

            default value: false'
        tag:
          type:
          - string
          - 'null'
          description: 'user-defined task identifier

            optional field

            the character limit is 255

            you can use this parameter to identify the task and match it with the result

            you will find the specified tag value in the data object of the response'
      example:
      - target: newmouth.com
        intersecting_domains:
        - dentaly.org
        - health.com
        - trysnow.com
        language_name: English
        location_code: 2840
        limit: 3
