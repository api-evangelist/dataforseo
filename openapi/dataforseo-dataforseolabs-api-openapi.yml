            all — return metrics for both types of SERPs.

            default value: live'
        item_types:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'display results by item type

            optional field

            indicates the type of search results included in the response

            Note: if the item_types array contains item types that are different from the organic object, the results will be ordered by the first item type in the array; you will not be able to sort and filter results by the types of search results not included in the response;

            possible values:

            ["organic", "paid", "featured_snippet", "local_pack"]

            default value:

            ["organic", "paid"]'
        filters:
          type:
          - array
          - 'null'
          items:
            type:
            - object
            - 'null'
          description: 'array of results filtering parameters

            optional field

            you can add several filters at once (8 filters maximum)

            you should set a logical operator and, or between the conditions

            the following operators are supported:

            regex, not_regex, <, <=, >, >=, =, <>, in, not_in

            example:

            ["metrics.organic.pos_1,">",0]

            [[["metrics.organic.count",">=",100],"and",["metrics.organic.pos_1",">",0]],

            "or",

            ["metrics.organic.etv","in",[10,100]]]

            for more information about filters, please refer to Dataforseo Labs – Filters or this help center guide'
        order_by:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'results sorting rules

            optional field

            you can use the same values as in the filters array to sort the results

            possible sorting types:

            asc – results will be sorted in the ascending order

            desc – results will be sorted in the descending order

            you should use a comma to specify a sorting type

            example:

            ["metrics.paid.etv,asc"]

            Note: you can set no more than three sorting rules in a single request

            you should use a comma to separate several sorting rules

            example:

            ["metrics.organic.etv,desc","metrics.paid.count,asc"]

            default rule:

            ["metrics.organic.count,desc"]

            Note: if the item_types array contains item types that are different from the organic object, the results will be ordered by the first item type in the array'
        limit:
          type:
          - integer
          - 'null'
          description: 'the maximum number of returned categories

            optional field

            default value: 100

            maximum value: 1000'
        offset:
          type:
          - integer
          - 'null'
          description: "offset in the results array of returned categories \noptional field\ndefault value: 0\nif you specify the 10 value, the first ten categories in the results array will be omitted and the data will be provided for the successive categories"
        tag:
          type:
          - string
          - 'null'
          description: 'user-defined task identifier

            optional field

            the character limit is 255

            you can use this parameter to identify the task and match it with the result

            you will find the specified tag value in the data object of the response'
      example:
      - target: dataforseo.com
        language_code: en
        location_name: United States
        item_types:
        - paid
        - organic
        - featured_snippet
        - local_pack
        limit: 3
