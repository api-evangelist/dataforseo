          description: results sorting rulesoptional fieldyou can use the same values as in the filters array to sort the resultspossible sorting types:asc - results will be sorted in the ascending orderdesc - results will be sorted in the descending orderthe comma is used as a separatorexample:["metrics.organic.pos_1,desc"]default rule:["metrics.organic.count,desc"]note that you can set no more than three sorting rules in a single requestyou should use a comma to separate several sorting rulesexample:["expiration_datetime,asc","metrics.organic.etv,desc","metrics.organic.pos_1,desc"]
        tag:
          type:
          - string
          - 'null'
          description: user-defined task identifieroptional fieldthe character limit is 255you can use this parameter to identify the task and match it with the resultyou will find the specified tag value in the data object of the response
