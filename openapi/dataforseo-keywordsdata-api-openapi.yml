    KeywordsDataGoogleAdsKeywordsForKeywordsTaskPostRequestInfo:
      type: object
      properties:
        keywords:
          type: array
          items:
            type: string
          description: 'keywords

            required field

            The maximum number of keywords you can specify: 20

            The maximum number of characters for each keyword: 80

            the keywords you specify will be converted to a lowercase format

            Note: Google Ads may return no data for certain groups of keywords

            visit our Help Center to learn more

            Also note that Google Ads doesn’t allow using certain symbols and characters (e.g., UTF symbols, emojis), so you can’t use them when setting a task;

            to learn more about which symbols and characters can be used, please refer to this article

            learn more about rules and limitations of keyword and keywords fields in DataForSEO APIs in this Help Center article'
        target:
          type:
          - string
          - 'null'
          description: 'target website

            optional field

            specify a website or URL to get a list of keywords relevant to it;

            Note: if a website url is specified, you will still get keywords relevant for the entire website'
        location_name:
          type:
          - string
          - 'null'
          description: 'full name of search engine location

            optional field

            if you do not indicate the location, you will receive worldwide results, i.e., for all available locations;

            if you use this field, you don’t need to specify location_code or location_coordinate

            you can receive the list of available locations of the search engine with their location_name by making a separate request to https://api.dataforseo.com/v3/keywords_data/google_ads/locations

            example:

            London,England,United Kingdom'
        location_code:
          type:
          - integer
          - 'null'
          description: 'search engine location code

            optional field

            if you do not indicate the location, you will receive worldwide results, i.e., for all available locations;

            if you use this field, you don’t need to specify location_name or location_coordinate;

            you can receive the list of available locations of the search engines with their location_code by making a separate request to https://api.dataforseo.com/v3/keywords_data/google_ads/locations

            example:

            2840'
        location_coordinate:
          type:
          - string
          - 'null'
          description: 'GPS coordinates of a location

            optional field

            if you do not indicate the location, you will receive worldwide results, i.e., for all available locations;

            if you use this field, you don’t need to specify location_name or location_code;

            location_coordinate parameter should be specified in the “latitude,longitude” format;

            the data will be provided for the country the specified coordinates belong to;

            example:

            52.6178549,-155.352142'
        language_name:
          type:
          - string
          - 'null'
          description: 'full name of search engine language

            optional field

            you can receive the list of available languages of the search engine with their language_name by making a separate request to https://api.dataforseo.com/v3/keywords_data/google_ads/languages

            example:

            English'
        language_code:
          type:
          - string
          - 'null'
          description: 'search engine language code

            optional field

            you can receive the list of available languages of the search engine with their language_code by making a separate request to https://api.dataforseo.com/v3/keywords_data/google_ads/languages

            example:

            en'
        search_partners:
          type:
          - boolean
          - 'null'
          description: 'include Google search partners

            optional field

            if you specify true, the results will be delivered for owned, operated, and syndicated networks across Google and partner sites that host Google search;

            default value: false – results are returned for Google search sites'
        date_from:
          type:
          - string
          - 'null'
          description: 'starting date of the time range

            optional field

            date format: "yyyy-mm-dd"

            minimal value: 4 years from the current date

            by default, data is returned for the past 12 months;

            Note: the indicated date cannot be greater than that specified in date_to and/or yesterday’s date;if Status endpoint returns false in the actual_data field, date_from can be set to the month before last and prior;

            if Status endpoint returns true in the actual_data field, date_from can be set to the last month and prior'
        date_to:
          type:
          - string
          - 'null'
          description: 'ending date of the time range

            optional field

            Note: the indicated date cannot be greater than yesterday’s date;

            if you don’t specify this field, yesterday’s date will be used by default

            date format: "yyyy-mm-dd"

            example:

            "2022-11-30"'
        sort_by:
          type:
          - string
          - 'null'
          description: 'results sorting parameters

            optional field

            Use these parameters to sort the results by relevance, search_volume, competition_index, low_top_of_page_bid, or high_top_of_page_bid in descending order

            default value: relevance'
        include_adult_keywords:
          type:
          - boolean
          - 'null'
          description: 'include keywords associated with adult content

            optional field

            if set to true, adult keywords will be included in the response

            default value: false

            note that the API may return no data for such keywords due to Google Ads restrictions'
        postback_url:
          type:
          - string
          - 'null'
          description: 'URL for sending task results

            optional field

            once the task is completed, we will send a POST request with its results compressed in the gzip format to the postback_url you specified

            you can use the ‘$id’ string as a $id variable and ‘$tag’ as urlencoded $tag variable. We will set the necessary values before sending the request.

            example:

            http://your-server.com/postbackscript?id=$id

            http://your-server.com/postbackscript?id=$id&tag=$tag

            Note: special characters in postback_url will be urlencoded;

            i.a., the # character will be encoded into %23

            learn more on our Help Center'
        pingback_url:
          type:
          - string
          - 'null'
          description: 'notification URL of a completed task

            optional field

            when a task is completed we will notify you by GET request sent to the URL you have specified

            you can use the ‘$id’ string as a $id variable and ‘$tag’ as urlencoded $tag variable. We will set the necessary values before sending the request

            example:

            http://your-server.com/pingscript?id=$id

            http://your-server.com/pingscript?id=$id&tag=$tag

            Note: special characters in pingback_url will be urlencoded;

            i.a., the # character will be encoded into %23

            learn more on our Help Center'
        tag:
          type:
          - string
          - 'null'
          description: 'user-defined task identifier

            optional field

            the character limit is 255

            you can use this parameter to identify the task and match it with the result

            you will find the specified tag value in the data object of the response'
      example:
      - location_code: 2840
        keywords:
        - phone
        - cellphone
