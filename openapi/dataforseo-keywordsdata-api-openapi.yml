            schema:
              type: array
              items:
                type:
                - object
                - 'null'
                oneOf:
                - $ref: '#/components/schemas/KeywordsDataGoogleAdsSearchVolumeTaskPostRequestInfo'
              example:
              - location_name: United States
                keywords:
                - buy laptop
                - cheap laptops for sale
                - purchase laptop
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type:
