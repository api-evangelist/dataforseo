            supported languages:

            English, French, German'
        language_code:
          type:
          - string
          - 'null'
          description: 'search engine language code

            required field if you don’t specify language_name

            if you use this field, you don’t need to specify language_name

            supported languages:

            en, fr, de'
        sort_by:
          type:
          - string
          - 'null'
          description: 'results sorting parameters

            optional field

            Use these parameters to sort the results by search_volume, cpc, competition or relevance in the descending order

            default value: relevance'
        keywords_negative:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'keywords negative array

            optional field

            These keywords will be ignored in the results array;

            You can specify a maximum of 200 terms that you want to exclude from the results;

            the specified keywords will be converted to lowercase format'
        device:
          type:
          - string
          - 'null'
          description: 'device type

            optional field

            specify this field if you want to get the data for a particular device type;

            possible values: all, mobile, desktop, tablet

            default value: all'
        date_from:
          type:
          - string
          - 'null'
          description: 'starting date of the time range

            optional field

            minimal value: 24 months from today’s date;

            if you don’t specify this field, data will be provided for the last 12 months

            date format: "yyyy-mm-dd"

            example:

            "2020-01-01"

            Note: we do not recommend using a custom time range for the past year’s dates'
        date_to:
          type:
          - string
          - 'null'
          description: 'ending date of the time range

            optional field

