    BusinessDataBusinessListingsCategoriesAggregationLiveRequestInfo:
      type: object
      properties:
        categories:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'business categories

            optional field

            the categories you specify are used to search for business listings;

            if you don’t use this field, we will return business listings found in the specified location;

            you can specify up to 10 categories'
        description:
          type:
          - string
          - 'null'
          description: 'description of the element in SERP

            optional field

            the description of the business entity for which the results are collected;

            can contain up to 200 characters'
        title:
          type:
          - string
          - 'null'
          description: 'title of the element in SERP

            optional field

            the name of the business entity for which the results are collected;

            can contain up to 200 characters'
        is_claimed:
          type:
          - boolean
          - 'null'
          description: 'indicates whether the business is verified by its owner on Google Maps

            optional field'
        location_coordinate:
          type:
          - string
          - 'null'
          description: 'GPS coordinates of a location

            optional field

            location_coordinate parameter should be specified in the “latitude,longitude,radius” format

            the maximum number of decimal digits for “latitude” and “longitude”: 7

            the minimum value for “radius”: 1

            the maximum value for “radius”: 100000

            example:

            53.476225,-2.243572,200'
        initial_dataset_filters:
          type:
          - array
          - 'null'
          items:
            type:
            - object
            - 'null'
          description: 'array of results filtering parameters

            optional field

            you can add several filters at once (8 filters maximum)

            you should set a logical operator and, or between the conditions

            the following operators are supported:

            regex, not_regex, <, <=, >, >=, =, <>, in, not_in, like, not_like, match, not_match

            you can use the % operator with like and not_like to match any string of zero or more characters

            example:

            ["rating.value",">",3]

            you can receive the list of available filters by making a separate request to https://api.dataforseo.com/v3/business_data/business_listings/available_filters

            The full list of possible filters is available here.'
        internal_list_limit:
          type:
          - integer
          - 'null'
          description: 'maximum number of elements within internal arrays

            optional field

            you can use this field to limit the number of elements within the aggregated categories

            default value: 10'
        limit:
          type:
          - integer
          - 'null'
          description: 'the maximum number of returned businesses

            optional field

            default value: 100

            maximum value: 1000'
        offset:
          type:
          - integer
          - 'null'
          description: 'the maximum number of returned businesses

            optional field'
        tag:
          type:
          - string
          - 'null'
          description: 'user-defined task identifier

            optional field

            the character limit is 255

            you can use this parameter to identify the task and match it with the result

            you will find the specified tag value in the data object of the response'
      example:
      - categories:
        - pizza_restaurant
        description: pizza
        title: pizza
        is_claimed: true
        location_coordinate: 53.476225,-2.243572,10
        initial_dataset_filters:
        - - rating.value
          - '>'
          - 3
        limit: 3
    BusinessDataGoogleHotelInfoTaskPostRequestInfo:
      type: object
      properties:
        hotel_identifier:
          type:
          - string
          - 'null'
          description: 'unique hotel identifier

            required field if you don’t specify keyword

            if you use this field, you don’t need to specify keyword

            unique identifier of a hotel entity in Google search;

            you can obtain the value by making a request to Advanced Google SERP API (enclosed in the hotels_pack element of the response), or the Hotel Searches endpoint of Business Data API

            example:

            ChYIq6SB--i6p6cpGgovbS8wN2s5ODZfEAE'
        keyword:
          type:
          - string
          - 'null'
          description: 'keyword

            required field if you don’t specify hotel_identifier

            if you use this field, you don’t need to specify hotel_identifier

            the keyword you specify should indicate the name of the hotel entity

            you can specify up to 700 characters in the keyword filed

            all %## will be decoded (plus character ‘+’ will be decoded to a space character)

            if you need to use the “%” character for your keyword, please specify it as “%25”'
        priority:
          type:
          - integer
          - 'null'
          description: 'task priority

            optional field

            can take the following values:

            1 – normal execution priority (set by default)

            2 – high execution priority

            You will be additionally charged for the tasks with high execution priority.

            The cost can be calculated on the Pricing page.'
        location_name:
          type:
          - string
          - 'null'
          description: 'full name of search engine location

            required field if you don’t specify location_code or location_coordinate

            if you use this field, you don’t need to specify location_code or location_coordinate

            you can receive the list of available locations with location_name by making a separate request to https://api.dataforseo.com/v3/business_data/google/locations

            example:

            London,England,United Kingdom'
        location_code:
          type:
          - integer
          - 'null'
          description: 'search engine location code

            required field if you don’t specify location_name or location_coordinate

            if you use this field, you don’t need to specify location_name or location_coordinate

            you can receive the list of available locations with location_code by making a separate request to the https://api.dataforseo.com/v3/business_data/google/locations

            example:

            2840'
        location_coordinate:
          type:
          - string
          - 'null'
          description: 'GPS coordinates of a location

            required field if you don’t specify location_name or location_code

            if you use this field, you don’t need to specify location_name or location_code

            location_coordinate parameter should be specified in the “latitude,longitude” format

            the maximum number of decimal digits for “latitude” and “longitude”: 7

            Note: if the coordinates are used to set a location, the search will occur in the nearest settlement;

            example:

            53.476225,-2.243572'
        language_name:
          type:
          - string
          - 'null'
          description: 'full name of search engine language

            required field if you don’t specify language_code

            if you use this field, you don’t need to specify language_code

            you can receive the list of available languages with language_name by making a separate request to https://api.dataforseo.com/v3/business_data/google/languages

            example:

            English'
        language_code:
          type:
          - string
          - 'null'
          description: 'search engine language code

            required field if you don’t specify language_name

            if you use this field, you don’t need to specify language_name

            you can receive the list of available languages with their language_code by making a separate request to https://api.dataforseo.com/v3/business_data/google/languages

            example:

            en'
        check_in:
          type:
          - string
          - 'null'
          description: 'check-in date

            optional field

            if you don’t specify this field, tomorrow’s date will be used by default;

            the value must not be earlier than today’s date

            date format: "yyyy-mm-dd"

            example:

            "2019-01-15"'
        check_out:
          type:
          - string
          - 'null'
          description: 'check-out date

            optional field

            if you don’t specify this field, our system will apply the date of two days from now by default;

            Note: the value cannot be less than or equal to check_in;

            the range between check_in and check_out values cannot exceed 30 days

            date format: "yyyy-mm-dd"

            example:

            "2019-01-15"'
        currency:
          type:
          - string
          - 'null'
          description: 'currency

            optional field

            example:

            "USD"'
        adults:
          type:
          - integer
          - 'null'
          description: 'number of adults

            optional field

            if you don’t specify this field, two adults will be used by default

            example:

            1'
        children:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'number and age of children

            optional field

            if you don’t specify this field, no children will be included in the search;

            set the following value if you want to include one 14-years-old child:

            [14]

            set the following value if you want to include one 13-years-old child and one 8-years-old child:

            [13,8]'
        load_prices_by_dates:
          type:
          - boolean
          - 'null'
          description: 'load hotel stay prices by dates

            optional field

            if you specify this parameter with true, the response will include the prices_by_dates array with hotel stay prices divided by dates

            if you use this parameter, you will be charged double the base price for a request'
        prices_start_date:
          type:
          - string
          - 'null'
          description: 'start date to load prices by dates

            optional field

            to use this parameter, you must specify load_prices_by_dates with true

            if this parameter is not specified, the start date is set to check_in date

            date format: yyyy-mm-dd

            example:

            2025-05-20'
        prices_end_date:
          type:
          - string
          - 'null'
          description: 'end date to load prices by dates

            optional field

            to use this parameter, you must specify load_prices_by_dates with true

            if this parameter is not specified, you will get prices by date for the month

            date format: yyyy-mm-dd

            example:

            2025-05-21'
        prices_date_range:
          type:
          - string
          - 'null'
          description: 'predefined period for retrieving daily price data

            optional field

            to use this parameter, you must specify load_prices_by_dates with true

            if the prices_start_date is not specified, the start date is set to check_in date

            possible values: month, three_months, six_months, year

            default value: month'
        tag:
          type:
          - string
          - 'null'
          description: 'user-defined task identifier

            optional field

            the character limit is 255;

            you can use this parameter to identify the task and match it with the result;

            you will find the specified tag value in the data object of the response'
        postback_url:
          type:
          - string
          - 'null'
          description: 'URL for sending task results

            optional field

            once the task is completed, we will send a POST request with its results compressed in the gzip format to the postback_url you specified;

            you can use the ‘$id’ string as a $id variable and ‘$tag’ as urlencoded $tag variable. We will set the necessary values before sending the request;

            example:

            http://your-server.com/postbackscript?id=$id

            http://your-server.com/postbackscript?id=$id&tag=$tag

            Note: special characters in postback_url will be urlencoded;

            i.a., the # character will be encoded into %23

            learn more on our Help Center'
        postback_data:
          type:
          - string
          - 'null'
          description: 'postback_url datatype

            required field if you specify postback_url

            corresponds to the datatype that will be sent to your server

            possible values:

            advanced, html'
        pingback_url:
          type:
          - string
          - 'null'
          description: 'notification URL of a completed task

            optional field

            when a task is completed we will notify you by GET request sent to the URL you have specified;

            you can use the ‘$id’ string as a $id variable and ‘$tag’ as urlencoded $tag variable;

            we will set the necessary values before sending the request;

            example:

            http://your-server.com/pingscript?id=$id

            http://your-server.com/pingscript?id=$id&tag=$tag

            Note: special characters in pingback_url will be urlencoded;

            i.a., the # character will be encoded into %23

            learn more on our Help Center'
      example:
      - language_code: en
        location_name: New York,New York,United States
        hotel_identifier: ChYIq6SB--i6p6cpGgovbS8wN2s5ODZfEAE
        tag: some_string_123
        postback_url: https://your-server.com/postbackscript.php
        postback_data: advanced
