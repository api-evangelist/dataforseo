components:
  schemas:
    MessageInfo:
      type: object
      properties:
        level:
          type:
          - string
          - 'null'
          description: 'level of error

            can take the following values: fatal, error, warning, info'
        message:
          type:
          - string
          - 'null'
          description: 'message associated with an error

            message providing the details of the detected error'
    OnPageHtmlResourceItem:
      type: object
      allOf:
      - type:
        - object
        - 'null'
        oneOf:
        - $ref: '#/components/schemas/BaseOnPageResourceItem'
      - type: object
        properties:
          meta:
            type:
            - object
            - 'null'
            oneOf:
            - $ref: '#/components/schemas/PageMetaInfo'
            properties:
              social_media_tags:
                type:
                - object
                - 'null'
                additionalProperties:
                  type:
                  - string
                  - 'null'
              broken_html:
                type:
                - object
                - 'null'
                oneOf:
                - $ref: '#/components/schemas/OnPageResourceIssueInfo'
                description: resource errors and warnings
            description: 'page properties

              the value depends on the resource_type'
          page_timing:
            type:
            - object
            - 'null'
            oneOf:
            - $ref: '#/components/schemas/PageTiming'
            description: object of page load metrics
          onpage_score:
            type:
            - number
            - 'null'
            description: 'shows how page is optimized on a 100-point scale

              this field shows how page is optimized considering critical on-page issues and warnings detected;

              100 is the highest possible score that means the page does not have any critical on-page issues and important warnings;

              learn more about how the metric is calculated in this help center article'
          total_dom_size:
            type:
            - integer
            - 'null'
            description: total DOM size of a page
            format: int64
          custom_js_response:
            type:
            - object
            - 'null'
            description: 'the result of executing a specified JS script

              note that you should specify a custom_js field when setting a task to receive this data and the field type and its value will totally depend on the script you specified;

              you can also filter the results by this value specifying filters in the following way:

              ["custom_js_response.url", "like", "pixel"]'
          custom_js_client_exception:
            type:
            - string
            - 'null'
            description: 'error when executing a custom js

              if the error occurred when executing the script you specified in the custom_js field, the error message would be displayed here'
          broken_resources:
            type:
            - boolean
            - 'null'
            description: indicates whether a page contains broken resources
          broken_links:
            type:
            - boolean
            - 'null'
            description: indicates whether a page contains broken links
          duplicate_title:
            type:
            - boolean
            - 'null'
            description: indicates whether a page has duplicate title tags
          duplicate_description:
            type:
            - boolean
            - 'null'
            description: indicates whether a page has a duplicate description
          duplicate_content:
            type:
            - boolean
            - 'null'
            description: indicates whether a page has duplicate content
          click_depth:
