            "and",

            [["link_from","like","%example.com/blog%"],"or",["link_from","like","%example.com/help%"]]]

            The full list of possible filters is available by this link.'
        search_after_token:
          type:
          - string
          - 'null'
          description: 'token for subsequent requests

