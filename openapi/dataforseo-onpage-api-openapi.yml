            - integer
            - 'null'
            description: 'number of clicks it takes to get to the page

              indicates the number of clicks from the homepage needed before landing at the target page'
          is_resource:
            type:
            - boolean
            - 'null'
            description: indicates whether a page is a single resource
          url_length:
            type:
            - integer
            - 'null'
            description: page URL length in characters
