format_note: >-
  The Updates feed renders relative ages ("7 days ago", "1 months ago") rather
  than dates in the listing markup, and there is no dated RSS feed
  (/updates/feed returns a comments feed whose lastBuildDate is 2023-11-22).
  Where an exact date could be read from the post's own og:updated_time meta tag
  it is recorded in `date`; otherwise `date` is null and `age_at_observation`
  carries the provider's own relative wording. Dates stated inside a post body
  are recorded in `effective_date`.

